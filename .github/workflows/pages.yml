name: Deploy Zhizhel Funeral Ledger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir dist
          node --check archive.js
          node --check speeches.js
          cp index.html archive.css archive.js speeches.js dist/
          base64 --decode apple-touch-icon.png.b64 > dist/apple-touch-icon.png
          test -s dist/apple-touch-icon.png
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 15); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | .id" | grep -q '[0-9]'; then
              echo "Pages artifact is available."
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/15)"
            sleep 4
          done
          echo "::error::Uploaded Pages artifact is not visible to the deployment API."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
